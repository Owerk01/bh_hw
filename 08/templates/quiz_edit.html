{% extends "base.html" %}
{% block main_menu %}
{{ super() }}
{% include 'quiz_menu.html' %}
{% endblock %}

{% block content1_head %}
<h2>Редактировать квиз</h2>
{% endblock %}

{% block content1 %}
<div class="quiz_form">
  <form method="post">
    <label for="name">Название квиза:</label><br>
    <input type="text" name="name" value="{{ quiz.name }}" required><br><br>

    <label for="user_id">Владелец:</label><br>
    <select name="user_id" required>
      {% for u in users %}
        <option value="{{ u.id }}" {% if u.id == quiz.user_id %}selected{% endif %}>
          {{ u.name }}
        </option>
      {% endfor %}
    </select><br><br>

    <input type="submit" value="Сохранить" class="button">
      <a href="{{ url_for('view_quiz_edit') }}" class="button">Назад</a>
</form>
</div>
{% endblock %}
